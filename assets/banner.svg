<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="إبداعي — EBDAAI">
<style>
  .t, .core { transform-box: fill-box; transform-origin: center; animation: build 5.2s cubic-bezier(.2,.7,.2,1) infinite both; }
  .core { animation-name: core; }
  @keyframes build {
    0% { opacity: 0; transform: scale(.2) rotate(-12deg); }
    9% { opacity: 1; transform: scale(1.14) rotate(0); }
    15%, 74% { opacity: 1; transform: scale(1); }
    42% { opacity: .62; }
    52% { opacity: 1; }
    88%, 100% { opacity: 0; transform: scale(.5); }
  }
  @keyframes core {
    0% { opacity: 0; transform: scale(.4); }
    6% { opacity: 1; transform: scale(1.5); }
    12%, 80% { opacity: 1; transform: scale(1); }
    40% { transform: scale(1.25); }
    90%, 100% { opacity: 0; transform: scale(.6); }
  }
  .glow { animation: glow 5.2s ease-in-out infinite; }
  @keyframes glow { 0%, 10%, 90%, 100% { opacity: 0; } 30%, 60% { opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .t, .core, .glow { animation: none; opacity: 1; } }
  .name { font: 800 104px 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; }
  .ar { font: 800 64px 'Segoe UI', Tahoma, 'Geeza Pro', Arial, sans-serif; }
  .tag { font: 500 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
  .in { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both; }
  .in2 { animation: rise 1.2s .25s cubic-bezier(.2,.7,.2,1) both; }
  .in3 { animation: rise 1.2s .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style><defs>
